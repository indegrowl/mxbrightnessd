name: mxbrightnessd
arch: "${PKG_ARCH}"
platform: linux
version: "${PKG_VERSION}"
release: "${PKG_RELEASE}"
section: utils
priority: optional
maintainer: "Mufeed Ali <mufeeda@mechasystems.com>"
description: Brightness daemon for Mechanix OS
homepage: https://github.com/mecha-org/mxbrightnessd
license: BSD

contents:
  - src: ./target/aarch64-unknown-linux-gnu/release/mxbrightnessd
    dst: /usr/bin/mxbrightnessd
    file_info:
      mode: 0755

  - src: ./data/mxbrightnessd.service
    dst: /usr/lib/systemd/user/mxbrightnessd.service
    file_info:
      mode: 0644

  # The `video` group drives the backlight and the light sensor.
  - src: ./data/90-mxbrightnessd.rules
    dst: /usr/lib/udev/rules.d/90-mxbrightnessd.rules
    file_info:
      mode: 0644

  - src: ./schema/org.mechanix.brightness.toml
    dst: /usr/share/mxconfig/schemas/org.mechanix.brightness.toml
    file_info:
      mode: 0644
